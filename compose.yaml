# Full local stack: `podman compose up --build` or `docker compose up --build`.
name: bi-platform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BI_CARGO_FEATURES: dev-auth
    environment:
      BI_DATABASE_URL: postgres://bi:bi@postgres:5432/bi
      BI_PUBLIC_ORIGIN: http://127.0.0.1:8080
      BI_DEV_USERS: '[{"id":"synthetic-analyst","display_name":"Analista sintético"},{"id":"synthetic-viewer","display_name":"Lector sintético"}]'
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
      POSTGRES_DB: bi
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
