version: '0.2.0.dev0'
name: Ventas
custom_extensions:
  - vendor_name: bi-platform
    data: '{"version": 1, "semantic_version": "0.1.0", "policies": [{"name": "zona", "dataset": "ventas", "enforcement": "mandatory", "predicate": "region = :department", "context": [{"name": "department", "type": "string", "sensitivity": "sensitive"}]}]}'
datasets:
  - name: ventas
    source: lake.main.ventas
    primary_key: [id]
    fields:
      - name: id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: id
      - name: region
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: region
      - name: ciudad
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: ciudad
      - name: importe
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: importe
      - name: instante
        datatype: DateTimeTz
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: instante
      - name: nota
        dimension: {}
        custom_extensions:
          - vendor_name: bi-platform
            data: '{"version": 1, "sensitivity": "restricted"}'
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: nota
      - name: secreto_centinela
        dimension: {}
        custom_extensions:
          - vendor_name: bi-platform
            data: '{"version": 1, "sensitivity": "restricted"}'
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: nota
metrics:
  - name: importe_total
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(ventas.importe)
  - name: filas
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(ventas.id)
  - name: margen
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "sensitivity": "confidential"}'
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(ventas.importe)
  - name: reserva_centinela
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "sensitivity": "restricted"}'
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(ventas.id)
