version: '0.2.0.dev0'
name: Ventas con observación
custom_extensions:
  - vendor_name: bi-platform
    data: '{"version": 1, "semantic_version": "0.1.0", "policies": [{"name": "zona", "dataset": "ventas", "enforcement": "mandatory", "predicate": "region = :department", "context": [{"name": "department", "type": "string", "sensitivity": "sensitive"}]}]}'
datasets:
  - name: ventas
    source: lake.main.ventas
    primary_key: [id]
    fields:
      - name: id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: id
      - name: region
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: region
      - name: ciudad
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: ciudad
      - name: importe
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: importe
      # A test dimension declared for #265: the same nullable column the
      # restricted `nota` reads, public here so a row filter can test NULL.
      - name: observacion
        dimension: {}
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: nota
metrics:
  - name: importe_total
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(ventas.importe)
  - name: filas
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(ventas.id)
