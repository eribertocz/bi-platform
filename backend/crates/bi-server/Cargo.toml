[package]
name = "bi-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["bundled-duckdb"]
# DuckDB compiled from source; the container image disables it and links the
# official prebuilt libduckdb instead (see Dockerfile).
bundled-duckdb = ["bi-runtime/bundled"]
# Synthetic identities only; absent from the default production build.
dev-auth = []
# Integration tests that need a real PostgreSQL reachable through DATABASE_URL.
postgres-tests = []

[dependencies]
axum.workspace = true
bi-audit = { path = "../bi-audit" }
bi-fixtures = { path = "../bi-fixtures" }
bi-runtime = { path = "../bi-runtime", default-features = false }
chrono.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
sef-adapter-duckdb = { path = "../sef-adapter-duckdb" }
sef-ossie = { path = "../sef-ossie" }
sef-model-ir = { path = "../sef-model-ir" }
getrandom.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
openidconnect = { version = "4.0.1", default-features = false }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
opentelemetry-proto.workspace = true
prost.workspace = true
rcgen.workspace = true
sysinfo.workspace = true
http-body-util.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower.workspace = true
base64 = "0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
