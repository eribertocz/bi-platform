[package]
name = "sef-model-ir"
description = "Engine-neutral canonical semantic model (CSMIR) of the Semantic Execution Fabric"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

# Canonical hashing pins its encoder and digest: changing them changes every
# semantic fingerprint (docs/semantica/adr/0001-sef-canonical-value-v1.md).
[dependencies]
ciborium = "=0.2.2"
semver = "=1.0.28"
sha2 = "=0.11.0"

[dev-dependencies]
proptest.workspace = true

# The workspace set plus SEF's: no unwrap, expect or panic in library code.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
