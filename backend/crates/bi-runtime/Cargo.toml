[package]
name = "bi-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["bundled"]
# Compile the DuckDB engine from source into the binary (local and CI).
# Without it, the build links the official prebuilt libduckdb of the same
# version found in DUCKDB_LIB_DIR, as the container image does.
bundled = ["duckdb/bundled", "duckdb/parquet"]
# Tests against a real DuckLake catalog in PostgreSQL (see tests/lake.rs).
postgres-tests = []

[dependencies]
bi-fixtures = { path = "../bi-fixtures" }
duckdb.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
