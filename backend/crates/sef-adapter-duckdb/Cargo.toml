[package]
name = "sef-adapter-duckdb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
duckdb.workspace = true
sef-ossie = { path = "../sef-ossie" }
sef-model-ir = { path = "../sef-model-ir" }

[dev-dependencies]
proptest.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
