[package]
name = "sef-adapter-duckdb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
duckdb = { workspace = true, features = ["vscalar", "vscalar-arrow"] }
chrono.workspace = true
chrono-tz = "=0.10.4"
getrandom.workspace = true
hmac = "0.13.0"
sha2.workspace = true
num-bigint = "0.4.8"
sef-ossie = { path = "../sef-ossie" }
sef-model-ir = { path = "../sef-model-ir" }
sef-exec-ir = { path = "../sef-exec-ir" }
sef-query-ir = { path = "../sef-query-ir" }
sef-correctness = { path = "../sef-correctness" }
sef-planner = { path = "../sef-planner" }

[dev-dependencies]
proptest.workspace = true
serde-saphyr = "1.3.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
