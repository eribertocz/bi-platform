[package]
name = "sef-query-ir"
description = "Canonical semantic query (SQIR) of the Semantic Execution Fabric"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
sef-model-ir = { path = "../sef-model-ir" }

[dev-dependencies]
proptest.workspace = true
# The corpus models, written as Ossie documents, compile to the frozen CSMIR.
sef-ossie = { path = "../sef-ossie" }
serde-saphyr = "=2.0.0"

# The workspace set plus SEF's: no unwrap, expect or panic in library code.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
