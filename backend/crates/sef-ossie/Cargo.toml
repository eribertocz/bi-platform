[package]
name = "sef-ossie"
description = "Apache Ossie boundary of the Semantic Execution Fabric: documents, validation and conversion to CSMIR"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
sef-model-ir = { path = "../sef-model-ir" }
serde.workspace = true
serde_json.workspace = true
# Pure-Rust YAML with duplicate-key rejection, resource budgets and located
# errors; serde_yaml is deprecated and unmaintained.
serde-saphyr = "=2.0.0"
sqlparser = { version = "0.63.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Checks that every document we emit validates against the official schema.
jsonschema = { version = "0.58.6", default-features = false }
proptest.workspace = true

# The workspace set plus SEF's: no unwrap, expect or panic in library code.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
