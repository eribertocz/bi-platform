[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
arrow-array = "58"
arrow-schema = "58"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Engine source or prebuilt library is chosen by the `bundled` feature of
# bi-runtime; the version must match the libduckdb the image downloads.
duckdb = { version = "=1.10506.0" }
getrandom = "0.4.3"
http-body-util = "0.1"
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = "6.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies, notably the bundled DuckDB C++ engine, build without debug
# info: DuckDB's full DWARF/PDB takes several GB per profile, exhausting CI
# runners' disks and slowing every build, and nobody steps into dependency
# code. Workspace crates keep full debug info.
[profile.dev.package."*"]
debug = false
