# Dependency policy checked by `cargo deny check` in CI (backend.yml):
# known vulnerabilities and yanked versions fail the build, only permissive
# licenses are accepted, and crates come only from crates.io.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Each exception: no fixed version exists, why it cannot reach the product,
# and what removes it. Re-checked whenever the dependency is upgraded.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "openidconnect 4.0.1 uses rsa 0.9.10 only for public JWKS signature verification; the server has no RSA private key, signing or decryption path. The private-key timing attack is unreachable. Remove when upstream switches or a fixed rsa release exists (#70)." },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained) is a compile-time macro of parquet 58; no runtime code. Remove when arrow-rs drops it." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 arrives only through openidconnect 4.0.1 (latest) -> p256/p384 0.13 -> elliptic-curve 0.13, which has no release on the fixed 0.7.6 line. The server only verifies public ES256 JWKS signatures; it holds no EC private key and has no signing, ECDH or decryption path, so no secret integer reaches the affected constant-time operations. Remove when openidconnect moves to elliptic-curve >= 0.14 (#70)." },
]

[licenses]
# Permissive licenses only: nothing copyleft reaches the product, so the
# owner's licensing choice stays open. A new license needs a reviewed PR.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are `publish = false` and carry no license field.
ignore = true

[bans]
# Duplicate versions come from upstream crates (sqlx, arrow, ureq…); they
# cost build time, not safety, so they are not a policy failure.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own private crates.
allow-wildcard-paths = true

# Layering (ADR 0008): only the edge adapters may depend directly on
# transport, storage and engine crates, and no module may depend on an
# adapter. A crate added here without its wrapper fails the build.
deny = [
    { crate = "aws-lc-rs", reason = "rustls uses ring exclusively; a second provider adds native compilation and ambiguous TLS initialization (#55)." },
    { crate = "aws-lc-sys", reason = "AWS-LC C/assembly must not return through transitive TLS features; ring is the selected rustls provider (#55)." },
    # HTTP transport and its contract generator: the server only.
    { crate = "axum", wrappers = ["bi-server"] },
    { crate = "utoipa", wrappers = ["bi-server"] },
    # Metadata store and telemetry export: the server only.
    { crate = "sqlx", wrappers = ["bi-server"] },
    { crate = "opentelemetry-otlp", wrappers = ["bi-server"] },
    # The embedded engine: execution and catalog adapters only.
    { crate = "duckdb", wrappers = ["bi-runtime", "sef-adapter-duckdb"] },
    # Adapters are composed by the server only; the semantic engine (sef-*)
    # never depends on them (also checked in backend.yml).
    { crate = "bi-runtime", wrappers = ["bi-server"] },
    { crate = "sef-adapter-duckdb", wrappers = ["bi-server"] },
    { crate = "bi-fixtures", wrappers = ["bi-runtime", "bi-server"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
