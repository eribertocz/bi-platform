# Each security advisory against what main already has arrives as its own
# small pull request with CI, verified and merged like any other (#128).
# Routine patches arrive grouped, once a week. Nothing merges by itself.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      cargo-patches:
        update-types: [patch]
    ignore:
      # The engine version follows its own review and Issue (#218): the
      # bindings must match the libduckdb the image downloads.
      - dependency-name: duckdb
      - dependency-name: libduckdb-sys
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-patches:
        update-types: [patch]
