name: backend

on:
  # Sin filtro de rutas: es un check obligatorio de main (protección de
  # rama) y debe reportar en todo PR, también los que no tocan backend/.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/oidc/**"
      - "compose.oidc.yaml"
      - "docs/api/openapi.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces without full DWARF: two test builds linking
  # DuckDB otherwise exhaust the runner's disk (dependencies already build
  # without debug info, see Cargo.toml). Local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bi
          POSTGRES_PASSWORD: bi
          POSTGRES_DB: bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi -d bi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Free runner disk (preinstalled SDKs this job never uses)
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests without development login (production defaults)
        run: cargo test --locked
      - name: DuckLake catalog database
        run: psql postgres://bi:bi@localhost:5432/bi -c "CREATE DATABASE bi_lake_catalog"
      - name: Start real OIDC provider
        working-directory: .
        run: |
          docker compose -f compose.oidc.yaml up -d keycloak
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18071/realms/bi-test/.well-known/openid-configuration >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Tests (including PostgreSQL and DuckLake integration)
        run: cargo test --locked --all-features
        env:
          DATABASE_URL: postgres://bi:bi@localhost:5432/bi
          BI_TEST_LAKE_CATALOG: dbname=bi_lake_catalog host=localhost port=5432 user=bi password=bi
          BI_TEST_OIDC_ISSUER: http://127.0.0.1:18071/realms/bi-test
      - name: Layering - the semantic engine stays independent (ADR 0008)
        # SEF cores (every sef-* except sef-adapter-*) are reusable by other
        # BI tools: with every feature on, no async runtime, transport,
        # storage, engine, adapter or bi-platform crate in their graph.
        # Adapters may use their engine, never the HTTP server or bi-* crates.
        # A failing cargo or jq fails the step instead of passing silently.
        shell: bash
        run: |
          core='^(tokio|axum|tower|hyper|reqwest|sqlx|duckdb|libduckdb-sys|clickhouse|opentelemetry|bi|sef-adapter)([-_][[:alnum:]_-]+)? '
          adapter='^(axum|utoipa|bi)([-_][[:alnum:]_-]+)? '
          crates=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[].name | select(startswith("sef-"))')
          test -n "$crates"
          for crate in $crates; do
            case "$crate" in sef-adapter-*) forbidden=$adapter ;; *) forbidden=$core ;; esac
            graph=$(cargo tree --locked -p "$crate" --all-features --target all -e normal --prefix none --format '{p}')
            if grep -E "$forbidden" <<<"$graph"; then
              echo "::error::$crate depends on a crate its layer forbids (ADR 0008)"
              exit 1
            fi
          done

      - name: Layering - audit contract stays independent (ADR 0008)
        shell: bash
        run: |
          graph=$(cargo tree --locked -p bi-audit --all-features --target all -e normal --prefix none --format '{p}')
          # The root is the audit core itself; inspect its dependencies only.
          if tail -n +2 <<<"$graph" | grep -E '^(tokio|axum|utoipa|tower|hyper|reqwest|sqlx|duckdb|libduckdb-sys|clickhouse|opentelemetry|bi|sef)([-_][[:alnum:]_-]+)? '; then
            echo '::error::bi-audit depends on infrastructure or another product module (ADR 0008)'
            exit 1
          fi

  bench:
    # Records a baseline (G0.13); no thresholds, shared runners are noisy.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Benchmark sales fixture (200k rows)
        run: cargo run --locked --release -p bi-fixtures -- bench --rows 200000 --iterations 5 --out bench-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: backend/bench-report.json
