name: dependencies

# Supply chain: known vulnerabilities, licenses and sources of every Rust
# crate (backend/deny.toml) and known vulnerabilities of every frontend
# package. Runs when dependencies change and daily, because advisories are
# published without any change on our side.
#
# A pull request answers for what it changes (#230): licenses, bans and
# sources always; known vulnerabilities only when it changes dependencies
# (.github/scripts/dependency-changes.sh, which fails closed). Push, the
# daily run and a manual run audit everything. An advisory against what
# main already has is fixed by its own pull request (Dependabot), never by
# stopping unrelated work.
on:
  # Sin filtro de rutas: cargo-deny y npm-audit son checks obligatorios de
  # main (protección de rama) y deben reportar en todo PR.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "backend/Cargo.lock"
      - "backend/**/Cargo.toml"
      - "backend/deny.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/dependencies.yml"
      - ".github/scripts/dependency-changes.sh"
  schedule:
    - cron: "41 5 * * *" # daily 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit: its first
          # parent is the base it merges into.
          fetch-depth: 2
      - name: Do known vulnerabilities apply to this change?
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: echo "advisories=$(bash .github/scripts/dependency-changes.sh backend "$EVENT" HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-deny (pinned release, verified checksum)
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$archive"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Licenses, bans and sources (always)
        run: cargo deny --locked check bans licenses sources
      - name: Known vulnerabilities
        if: steps.scope.outputs.advisories == 'true'
        run: cargo deny --locked check advisories
      - name: Known vulnerabilities skipped
        if: steps.scope.outputs.advisories != 'true'
        run: echo "Skipped - this pull request changes no backend dependency; main is audited on every push, daily at 05:41 UTC, and Dependabot opens its fixes."

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Do known vulnerabilities apply to this change?
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: echo "advisories=$(bash .github/scripts/dependency-changes.sh frontend "$EVENT" HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.advisories == 'true'
        with:
          node-version: '24.21.0'
      # Every package, not --omit=dev: the app is a static build, so all of
      # them are devDependencies, including the code bundled into it.
      - name: Known vulnerabilities
        if: steps.scope.outputs.advisories == 'true'
        run: npm audit
      - name: Known vulnerabilities skipped
        if: steps.scope.outputs.advisories != 'true'
        run: echo "Skipped - this pull request changes no frontend dependency; main is audited on every push, daily at 05:41 UTC, and Dependabot opens its fixes."

  # The rule that decides what a pull request is audited for, on a real git
  # repository: every case, a false negative included, and failing closed.
  dependency-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/dependency-changes.test.sh
